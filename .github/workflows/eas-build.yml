name: Android EAS Build
run-name: Android ${{ inputs.profile }} build · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Android build profile (development = APK, production = AAB)
        required: true
        type: choice
        default: development
        options:
          - development
          - production
      clear_cache:
        description: Clear the EAS build cache
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Do not interrupt an in-flight store build or race version-code allocation.
concurrency:
  group: eas-android-${{ inputs.profile }}
  cancel-in-progress: false

env:
  CI: true
  EXPO_NO_TELEMETRY: 1

jobs:
  quality:
    name: Quality checks
    uses: ./.github/workflows/ci.yml
    with:
      profile: ${{ inputs.profile }}

  build:
    name: Build and download Android ${{ inputs.profile }}
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    environment: ${{ inputs.profile }}
    env:
      BUILD_PROFILE: ${{ inputs.profile }}
      CLEAR_CACHE: ${{ inputs.clear_cache }}
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check Expo token is configured
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Configure the EXPO_TOKEN GitHub secret. See docs/github-eas-builds.md."
            exit 1
          fi

      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@b307475762933b98ed359c036b0e51f26b63b74b # v5.0.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Install the official CLI without exporting a token to all subsequent steps.
      - name: Set up EAS CLI
        uses: expo/expo-github-action@9da89d3617bb88139671bad31b09c65714c2ee06 # v9
        with:
          eas-version: 25.3.0
          packager: npm
          patch-watchers: false

      - name: Build on EAS and wait for completion
        timeout-minutes: 210
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          case "$BUILD_PROFILE" in
            development|production) ;;
            *) echo "::error::Unsupported build profile"; exit 1 ;;
          esac
          args=(build --platform android --profile "$BUILD_PROFILE" --non-interactive --wait --json --freeze-credentials)
          if [ "$CLEAR_CACHE" = "true" ]; then
            args+=(--clear-cache)
          fi
          eas "${args[@]}" > "$RUNNER_TEMP/eas-build.json"

      - name: Download and verify the completed build
        id: download
        timeout-minutes: 15
        run: |
          python3 scripts/ci/download_eas_build.py \
            --result-file "$RUNNER_TEMP/eas-build.json" \
            --profile "$BUILD_PROFILE" \
            --output-dir artifacts

      - name: Upload Android artifact and checksums
        id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: PlannerITI-android-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Link GitHub artifact in run summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          printf '\n[Download the GitHub artifact](%s) (retained for 14 days).\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
